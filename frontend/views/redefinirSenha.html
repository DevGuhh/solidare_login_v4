<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redefinir senha | Instituto Solidare</title>
    <link rel="stylesheet" href="../css/alterarSenha.css" />
  </head>
  <body>
    <main class="password-page">
      <section class="password-card">
        <h1>Redefinir senha</h1>
        <p>Crie uma nova senha para acessar o sistema.</p>
        <form id="formRedefinirSenha">
          <label
            >Nova senha<input
              id="novaSenha"
              type="password"
              minlength="6"
              required
              autocomplete="new-password" /></label
          ><label
            >Confirmar senha<input
              id="confirmarSenha"
              type="password"
              minlength="6"
              required
              autocomplete="new-password"
          /></label>
          <p id="mensagemRedefinirSenha" role="alert" hidden></p>
          <button id="btnRedefinirSenha" type="submit">
            Salvar nova senha
          </button>
        </form>
        <a href="../index.html">Voltar ao login</a>
      </section>
    </main>
    <script type="module" src="../js/redefinirSenha.js"></script>
  </body>
</html>
